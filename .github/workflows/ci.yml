name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # macos is a real audience for this tool; test the ends of the range
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: run tests
        run: pytest -q

      - name: how to reproduce this failure locally
        if: failure()
        run: |
          echo "::notice::python -m venv .venv && .venv/bin/pip install -e . pytest && .venv/bin/pytest -q  (python ${{ matrix.python }} on ${{ matrix.os }})"

  # The layer that would have caught 1.0.29 and 1.0.30: both were released
  # because the *installed* package failed to resolve on a new python, while
  # the source tree kept working fine. Building the wheel and installing it
  # into a clean interpreter is the only way to see that before users do.
  install-verification:
    name: install wheel (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      - name: consume it as a user would
        # cd out of the repo: from the source tree these commands pass even
        # when the packaged artifact is broken, because python imports the
        # local canvas_sak/ directory instead of the installed one.
        working-directory: /tmp
        run: |
          /tmp/clean/bin/canvas-sak --version
          /tmp/clean/bin/canvas-sak --help
          /tmp/clean/bin/python -c "import canvas_sak.core, canvas_sak.canvas_sak"

      - name: check the sdist is complete enough to build from
        run: |
          python -m venv /tmp/fromsdist
          /tmp/fromsdist/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/fromsdist/bin/canvas-sak --version

  # docs/reference/commands.md is generated from the CLI's own --help output. This
  # job regenerates it and fails if the committed copy has drifted, so adding an
  # option can't silently leave the reference describing a tool that no longer exists.
  docs-reference:
    name: command reference is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - run: python scripts/gen_command_reference.py --check

  # A dev container nobody builds rots quietly, and you find out when a contributor
  # clicks "Open in Codespaces" and it doesn't work. Building it here — and running
  # the suite inside it — means postCreateCommand is verified on every change.
  devcontainer:
    name: dev container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the container and run the tests inside it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: pytest -q
